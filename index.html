<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="FOTOS DA JULINHAH."
    >

    <title>Sem Nadinha de Roupa</title>

    <style>
        :root {
            --fundo: #050505;
            --amarelo: #ffd900;
            --verde: #16a34a;
            --verde-claro: #22c55e;
            --branco: #ffffff;
            --cinza: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding: 14px 12px 24px;
            background: var(--fundo);
            color: var(--branco);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            text-align: center;
        }

        .headline {
            margin-bottom: 12px;
            color: var(--amarelo);
            font-size: clamp(18px, 4vw, 30px);
            font-weight: 900;
            line-height: 1.12;
            text-transform: uppercase;
        }

        .chamada-video {
            margin-bottom: 10px;
            color: var(--branco);
            font-size: clamp(18px, 4vw, 25px);
            font-weight: 800;
        }

        .video-container {
            width: min(100%, 290px);
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid #292929;
            border-radius: 12px;
            background: #000000;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            max-height: 54vh;
            overflow: hidden;
            background: #000000;
        }

        #video-vsl {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000000;
        }

        /* CAPA DO VÍDEO */
        .capa-video {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(40, 40, 40, 0.82),
                    rgba(0, 0, 0, 0.98)
                );

            cursor: pointer;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .capa-video.oculta {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .play-grande {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 78px;
            height: 78px;

            margin-bottom: 18px;

            border: 3px solid var(--branco);
            border-radius: 50%;

            background: var(--verde);
            color: var(--branco);

            font-size: 34px;
            line-height: 1;

            box-shadow:
                0 0 0 8px rgba(22, 163, 74, 0.18),
                0 12px 30px rgba(0, 0, 0, 0.5);

            animation: pulsarPlay 1.6s infinite;
        }

        .texto-capa {
            color: var(--branco);

            font-size: clamp(20px, 5vw, 27px);
            font-weight: 900;

            line-height: 1.1;

            text-transform: uppercase;

            text-shadow: 0 3px 10px #000000;
        }

        /* CONTROLES */
        .controles {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 9px;

            background: #111111;
        }

        .controle {
            min-width: 48px;
            height: 38px;

            padding: 0 12px;

            border: 1px solid #3a3a3a;
            border-radius: 7px;

            background: #1c1c1c;
            color: var(--branco);

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .controle:hover {
            background: #292929;
        }

        .volume-container {
            display: flex;
            flex: 1;

            max-width: 150px;

            align-items: center;
        }

        .volume {
            width: 100%;

            cursor: pointer;

            accent-color: var(--verde);
        }

        /* ÁREA DO BOTÃO */
        .area-oferta {
            min-height: 92px;

            margin-top: 13px;
        }

        /* BOTÃO ESCONDIDO INICIALMENTE */
        .oferta {
            opacity: 0;
            visibility: hidden;

            transform: translateY(10px);

            pointer-events: none;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease,
                transform 0.5s ease;
        }

        /* BOTÃO APÓS 15 SEGUNDOS */
        .oferta.visivel {
            opacity: 1;
            visibility: visible;

            transform: translateY(0);

            pointer-events: auto;
        }

        .botao-checkout {
            display: block;

            width: min(100%, 480px);

            margin: 0 auto;

            padding: 16px 14px;

            border-radius: 11px;

            background: var(--verde);
            color: var(--branco);

            font-size: clamp(18px, 4vw, 23px);
            font-weight: 900;

            line-height: 1.1;

            text-decoration: none;

            text-transform: uppercase;

            box-shadow:
                0 0 0 5px rgba(22, 163, 74, 0.13),
                0 12px 30px rgba(22, 163, 74, 0.36);

            animation: pulsarBotao 1.5s infinite;
        }

        .botao-checkout:hover {
            background: var(--verde-claro);
        }

        .texto-seguranca {
            margin-top: 8px;

            color: var(--cinza);

            font-size: 12px;
        }

        .aviso {
            max-width: 570px;

            margin: 10px auto 0;

            color: #676767;

            font-size: 10px;

            line-height: 1.4;
        }

        /* ANIMAÇÃO DO PLAY */
        @keyframes pulsarPlay {
            0%,
            100% {
                transform: scale(1);

                box-shadow:
                    0 0 0 7px rgba(22, 163, 74, 0.15),
                    0 12px 30px rgba(0, 0, 0, 0.5);
            }

            50% {
                transform: scale(1.08);

                box-shadow:
                    0 0 0 14px rgba(22, 163, 74, 0.04),
                    0 15px 35px rgba(0, 0, 0, 0.6);
            }
        }

        /* ANIMAÇÃO DO BOTÃO */
        @keyframes pulsarBotao {
            0%,
            100% {
                box-shadow:
                    0 0 0 5px rgba(22, 163, 74, 0.13),
                    0 12px 30px rgba(22, 163, 74, 0.3);
            }

            50% {
                box-shadow:
                    0 0 0 10px rgba(22, 163, 74, 0.03),
                    0 15px 38px rgba(22, 163, 74, 0.48);
            }
        }

        /* CELULAR */
        @media (max-width: 480px) {

            body {
                padding: 10px 10px 18px;
            }

            .headline {
                margin-bottom: 8px;
                font-size: 18px;
            }

            .chamada-video {
                margin-bottom: 8px;
                font-size: 18px;
            }

            .video-container {
                width: min(100%, 245px);
            }

            .video-wrapper {
                max-height: 49vh;
            }

            .play-grande {
                width: 68px;
                height: 68px;

                margin-bottom: 14px;

                font-size: 29px;
            }

            .texto-capa {
                font-size: 20px;
            }

            .area-oferta {
                min-height: 82px;

                margin-top: 10px;
            }

            .botao-checkout {
                padding: 14px 11px;

                font-size: 18px;
            }

            .aviso {
                margin-top: 6px;

                font-size: 9px;
            }
        }

        /* CELULARES COM TELA BAIXA */
        @media (max-height: 700px) {

            .headline {
                font-size: 16px;
            }

            .chamada-video {
                font-size: 16px;
            }

            .video-container {
                width: 220px;
            }

            .video-wrapper {
                max-height: 45vh;
            }

            .area-oferta {
                min-height: 76px;
            }

            .botao-checkout {
                padding: 12px 10px;

                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1 class="headline">
            PARA VER MINHAS FOTOS BEM PELADINHA VEJA O VIDEO ABAIXO
        </h1>

        <p class="chamada-video">
            VOU TE EXPLICAR COMO ACESSAR AS FOTOS
        </p>

        <div class="video-container">

            <div class="video-wrapper">

                <video
                    id="video-vsl"
                    playsinline
                    preload="metadata"
                    controlslist="nodownload noplaybackrate nofullscreen"
                    disablepictureinpicture
                >

                    <source
                        src="./video.mp4"
                        type="video/mp4"
                    >

                    Seu navegador não conseguiu reproduzir o vídeo.

                </video>

                <!-- CAPA -->
                <div
                    id="capa-video"
                    class="capa-video"
                    role="button"
                    tabindex="0"
                    aria-label="Dar play para assistir ao vídeo"
                >

                    <div class="play-grande">
                        ▶
                    </div>

                    <div class="texto-capa">

                        Dê play para<br>
                        assistir ao vídeo

                    </div>

                </div>

            </div>

            <!-- CONTROLES -->

            <div class="controles">

                <button
                    id="play-pause"
                    class="controle"
                    type="button"
                    aria-label="Reproduzir ou pausar vídeo"
                >
                    ▶
                </button>

                <button
                    id="som"
                    class="controle"
                    type="button"
                    aria-label="Ativar ou desativar som"
                >
                    🔊
                </button>

                <div class="volume-container">

                    <input
                        id="volume"
                        class="volume"
                        type="range"
                        min="0"
                        max="100"
                        value="80"
                        aria-label="Volume do vídeo"
                    >

                </div>

            </div>

        </div>

        <!-- BOTÃO -->

        <div class="area-oferta">

            <div
                id="oferta"
                class="oferta"
            >

                <a
                    class="botao-checkout"
                    href="https://go.pepperpay.com.br/equxv"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    QUERO VER AS FOTOS
                </a>

                <p class="texto-seguranca"></p>

            </div>

        </div>

    </main>


    <script>

        const video =
            document.getElementById("video-vsl");

        const capaVideo =
            document.getElementById("capa-video");

        const playPause =
            document.getElementById("play-pause");

        const botaoSom =
            document.getElementById("som");

        const controleVolume =
            document.getElementById("volume");

        const oferta =
            document.getElementById("oferta");


        /* ========================================
           TEMPO PARA MOSTRAR O BOTÃO

           15000 = 15 segundos
           ======================================== */

        const TEMPO_PARA_MOSTRAR_BOTAO = 15000;


        video.volume = 0.8;


        /* REPRODUZIR VÍDEO */

        function reproduzirVideo() {

            video.play()

                .then(function () {

                    capaVideo.classList.add("oculta");

                })

                .catch(function (erro) {

                    console.error(
                        "Não foi possível reproduzir o vídeo:",
                        erro
                    );

                });

        }


        /* PLAY / PAUSE */

        function alternarVideo() {

            if (
                video.paused ||
                video.ended
            ) {

                reproduzirVideo();

            } else {

                video.pause();

            }

        }


        /* CLIQUE NA CAPA */

        capaVideo.addEventListener(
            "click",
            reproduzirVideo
        );


        /* TECLADO */

        capaVideo.addEventListener(
            "keydown",
            function (evento) {

                if (
                    evento.key === "Enter" ||
                    evento.key === " "
                ) {

                    evento.preventDefault();

                    reproduzirVideo();

                }

            }
        );


        /* CLIQUE NO VÍDEO */

        video.addEventListener(
            "click",
            alternarVideo
        );


        /* BOTÃO PLAY/PAUSE */

        playPause.addEventListener(
            "click",
            alternarVideo
        );


        /* QUANDO O VÍDEO COMEÇA */

        video.addEventListener(
            "play",
            function () {

                playPause.textContent = "❚❚";

                playPause.setAttribute(
                    "aria-label",
                    "Pausar vídeo"
                );

                capaVideo.classList.add(
                    "oculta"
                );

            }
        );


        /* QUANDO PAUSA */

        video.addEventListener(
            "pause",
            function () {

                playPause.textContent = "▶";

                playPause.setAttribute(
                    "aria-label",
                    "Reproduzir vídeo"
                );

            }
        );


        /* QUANDO TERMINA */

        video.addEventListener(
            "ended",
            function () {

                playPause.textContent = "▶";

                video.currentTime = 0;

                capaVideo.classList.remove(
                    "oculta"
                );

            }
        );


        /* BOTÃO DE SOM */

        botaoSom.addEventListener(
            "click",
            function () {

                video.muted =
                    !video.muted;


                if (video.muted) {

                    botaoSom.textContent = "🔇";

                    botaoSom.setAttribute(
                        "aria-label",
                        "Ativar som"
                    );

                } else {

                    botaoSom.textContent = "🔊";

                    botaoSom.setAttribute(
                        "aria-label",
                        "Desativar som"
                    );


                    if (
                        Number(
                            controleVolume.value
                        ) === 0
                    ) {

                        controleVolume.value = "80";

                        video.volume = 0.8;

                    }

                }

            }
        );


        /* CONTROLE DE VOLUME */

        controleVolume.addEventListener(
            "input",
            function () {

                const valor =
                    Number(
                        controleVolume.value
                    );


                video.volume =
                    valor / 100;


                video.muted =
                    valor === 0;


                botaoSom.textContent =
                    valor === 0
                        ? "🔇"
                        : "🔊";

            }
        );


        /* ========================================
           MOSTRAR BOTÃO APÓS 15 SEGUNDOS
           ======================================== */

        window.setTimeout(
            function () {

                oferta.classList.add(
                    "visivel"
                );

            },
            TEMPO_PARA_MOSTRAR_BOTAO
        );

    </script>

</body>
</html>
